name: Despertador de Streamlit Cloud

on:
  schedule:
    # Se ejecutará automáticamente cada 8 horas (tres veces al día)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Te permite pulsar el botón manual para probarlo ahora

jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - name: Crear entorno de simulación de navegador
        uses: actions/checkout@v4

      - name: Configurar Node.js (Motor del navegador)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright (Navegador real invisible)
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Abrir la aplicación y esperar el renderizado de JavaScript
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            console.log('Iniciando Chromium en la nube...');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            
            console.log('Abriendo la aplicación...');
            await page.goto('https://diabetes-prediccion-web.streamlit.app', { waitUntil: 'networkidle', timeout: 60000 });
            
            console.log('Esperando 15 segundos para la reactivación...');
            await page.waitForTimeout(15000);
            
            console.log('Proceso completado.');
            await browser.close();
          })();
          "
